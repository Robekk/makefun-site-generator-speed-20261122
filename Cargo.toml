[package]
name = "engine"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
serde_json = "1"
unicode-normalization = "0.1"
unicode_categories = "0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
